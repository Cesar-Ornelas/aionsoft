# yaml-language-server: $schema=../../.github/ai-workspace.schema.json
schema_version: 2
environment: copilot-vscode
profiles:
  - bun
  - sveltekit
  - tailwindcss
  - shadcn-svelte
  - pocketbase
  - docker-compose
  - data-portability
skills:
  - bootstrap-ai-workspace
  - aionsoft-feature-delivery
  - feature-context
  - provider-neutral-data-layer
  - shadcn-svelte
features:
  crm:
    description: Companies, contacts, addresses, relationships, opportunities, activities, and CRM collection setup.
    context:
      - ai/features/crm.md
    owned_paths:
      - src/lib/crm/
      - src/lib/server/crm-bootstrap.js
      - src/routes/crm/
      - ai/todos/crm.md
    shared_context:
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    validation_commands:
      - bun run cell:test:crm
      - bun run cell:build
  management:
    description: Cell users, groups, roles, permissions, and management migrations.
    context:
      - ai/features/management.md
    owned_paths:
      - src/lib/management/
      - src/lib/server/management-bootstrap.js
      - src/lib/server/management-migrations.js
      - src/routes/management/
    shared_context:
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    validation_commands:
      - bun run cell:build
  form-builder:
    description: Management-owned versioned forms with normalized schemas, conditional fields, calculations, validation, and future rendering or document workflows.
    context:
      - ai/features/form-builder.md
    owned_paths:
      - src/lib/management/model/form-*.js
      - src/lib/management/server/ports/form-repository.js
      - src/lib/management/server/services/form-service.js
      - src/lib/management/server/adapters/pocketbase/repositories.js
      - src/lib/management/server/tests/form-*.test.js
      - src/lib/management/definitions.js
      - src/lib/server/management-bootstrap.js
    shared_context:
      - src/lib/management/
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    depends_on:
      - management
    validation_commands:
      - bun run cell:test:forms
      - bun run cell:build
  documents:
    description: Reusable rich-text document templates and immutable HTML instances generated from published forms.
    context:
      - ai/features/documents.md
    owned_paths:
      - src/lib/documents/
      - src/routes/management/documents/
      - src/routes/operations/documents/
      - src/routes/operations/accounts/*/documents/
    shared_context:
      - src/lib/management/
      - src/lib/operations/
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    depends_on:
      - form-builder
      - operations
    validation_commands:
      - bun run cell:test:documents
      - bun run cell:build
  operations:
    description: Service accounts that group customer companies for operational delivery.
    context:
      - ai/features/operations.md
    owned_paths:
      - src/lib/operations/
      - src/routes/operations/accounts/
      - ai/todos/operations.md
    shared_context:
      - src/lib/crm/
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    validation_commands:
      - bun run cell:test:operations
      - bun run cell:build
  catalog:
    description: Reusable services, customer pricing, internal delivery costs, and service lifecycle management.
    context:
      - ai/features/catalog.md
    owned_paths:
      - src/lib/catalog/
      - src/routes/catalog/
      - ai/todos/catalog.md
    shared_context:
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    validation_commands:
      - bun run cell:test:catalog
      - bun run cell:build
  issues:
    description: Global Operations issues for customer, provider, and internal work with assignments, labels, comments, and resolution tracking.
    context:
      - ai/features/issues.md
    owned_paths:
      - src/lib/issues/
      - src/routes/operations/issues/
      - ai/todos/issues.md
    shared_context:
      - src/lib/crm/
      - src/lib/operations/
      - src/lib/management/
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    validation_commands:
      - bun run cell:test:issues
      - bun run cell:build
  billing:
    description: Customer billing agreements that snapshot catalog prices and manage independent service or plan lifecycle.
    context:
      - ai/features/billing.md
    owned_paths:
      - src/lib/billing/
      - src/routes/operations/accounts/
      - ai/todos/billing.md
    shared_context:
      - src/lib/catalog/
      - src/lib/operations/
      - src/lib/server/pocketbase.js
      - src/routes/setup/
    validation_commands:
      - bun run cell:test:billing
      - bun run cell:build
initialize_work_state: true
validation_commands:
  - bun run cell:build
  - bun run cell:infra:config
variables:
  app_name: cell
  app_path: apps/cell
  infrastructure_path: infra/crm
